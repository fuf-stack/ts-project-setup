# see: https://pnpm.io/next/npmrc#auto-install-peers
autoInstallPeers: true

# Wait 14 days (in minutes) before installing public dependencies.
# Keep this aligned with minimumReleaseAge in renovate.json5.
minimumReleaseAge: 20160

# Allow freshly published internal @fuf-stack packages.
minimumReleaseAgeExclude:
  - '@fuf-stack/*'

packages:
  - 'packages/*'

publicHoistPattern:
  # @fuf-stack/project-cli-tools
  - '@commitlint*'
  - '@lerna-lite*'
  - commitizen
  - cz-conventional-changelog
  - husky
  - lint-staged
  - nodemon
  - turbo
  - wait-on

  # @fuf-stack/eslint-config-fuf
  - '*eslint*'
  - '*prettier*'

  # @fuf-stack/vitest-config
  - '@vitest/coverage-v8'
  - vitest*
