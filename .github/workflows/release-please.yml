name: release-please

on:
  push:
    branches:
      - main

# Ensure only one release workflow runs at a time
# Queue new runs and wait for in-progress release-please workflow to complete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_GITHUB_TOKEN }}

  build-test:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.build-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Test release commit
        run: pnpm test --test-timeout=30000
      - name: Retain tested build
        id: build-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-build-${{ github.sha }}
          path: packages/vitest-config/dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: [release-please, build-test]
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: read
      id-token: write # npm trusted publishing; no repository write authority
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install publishing tools
        uses: ./.github/actions/setup-project
        with:
          build: 'false'
      - name: Restore tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build-test.outputs.artifact_id }}
          path: packages/vitest-config/dist/
          # Downloads by ID otherwise land in dist/<artifact-name>/.
          merge-multiple: true
      - name: Publish to npm
        # Use the installed, lock-selected binary and the tested build from this run.
        run: ./node_modules/.bin/lerna publish from-package --yes --no-verify-access
        env:
          # Lerna rewrites workspace specifiers; never reinstall or rebuild here.
          PNPM_CONFIG_FROZEN_LOCKFILE: 'false'
          NPM_CONFIG_FROZEN_LOCKFILE: 'false'
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'

  # update other conflicting prs after package merge
  # see: https://github.com/googleapis/release-please/issues/1870#issuecomment-1748390833
  check-conflicting-prs:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      repository-projects: read # needed for 'gh pr edit' https://github.com/cli/cli/issues/6274
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    outputs:
      need_rebase: ${{ steps.check-pending-prs.outputs.need_rebase }}
    steps:
      - name: Get pending PRs
        id: check-pending-prs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pending_prs=$(gh pr list --repo "$REPO" --label "autorelease: pending" --state open --json number --jq '.[].number')
          need_rebase=""

          if [[ -n "$pending_prs" ]]; then
            for pr_num in $pending_prs; do
              echo "Checking pr: $pr_num"
              mergeable=$(gh pr view --repo "$REPO" "$pr_num" --json mergeable --jq '.mergeable')
              echo "mergeable status: $mergeable"
              if [[ "$mergeable" != "MERGEABLE" ]]; then
                echo "pr: $pr_num is not MERGEABLE."
                echo "removing 'autorelease: pending' label from pr: $pr_num"
                gh pr edit --repo "$REPO" "$pr_num" --remove-label "autorelease: pending"
                need_rebase=true
              fi
            done
          else
              echo "No pending PRs found."
              exit 0
          fi

          if [[ -n "$need_rebase" ]]; then
            echo "not MERGEABLE status PRs found."
            echo "need_rebase=$need_rebase"
            echo "need_rebase=$need_rebase" >> "$GITHUB_OUTPUT"
          else
            echo "All pending PRs are MERGEABLE."
          fi

  release-please-rebase:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    needs: check-conflicting-prs
    if: needs.check-conflicting-prs.outputs.need_rebase == 'true'
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_GITHUB_TOKEN }}
