name: ci

# only on push in branches
on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: pnpm lint

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: pnpm test --test-timeout=30000
      - name: Summarize coverage
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';

          const { total } = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'));
          const metrics = ['statements', 'branches', 'functions', 'lines'];
          const rows = metrics.map((metric) => {
            const { pct, covered, total: count } = total[metric];
            return `| ${metric} | ${pct}% | ${covered}/${count} |`;
          });
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '### Test coverage', '',
            '| Metric | Coverage | Covered/Total |',
            '| --- | ---: | ---: |',
            ...rows, '',
          ].join('\n'));
          JS
      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 7
