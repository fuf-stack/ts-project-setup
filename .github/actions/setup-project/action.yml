name: 'Setup project'
description: 'Sets up node and installs node_modules with pnpm'

inputs:
  build:
    description: 'Build packages after installation'
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        registry-url: https://registry.npmjs.org/
        cache: pnpm

    - name: Install node_modules
      shell: bash
      # `--ignore-scripts` skips lifecycle scripts for this install step.
      run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
      env:
        # Redundant with `--ignore-scripts` (kept for explicitness if flags change later).
        # See: https://pnpm.io/cli/config#strict-dep-builds
        PNPM_CONFIG_STRICT_DEP_BUILDS: false

    - name: Build packages
      if: inputs.build == 'true'
      shell: bash
      run: pnpm build
